name: Kayyum verilerini güncelle

on:
  schedule:
    - cron: "17 0,6,12,18 * * *" # 6 saatte bir (TSİ 03:17, 09:17, 15:17, 21:17)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kayyum-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund
        working-directory: scripts

      - name: Haberleri tara
        run: node scripts/guncelle.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "kayyum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          if git diff --cached --quiet -- data/kayyumlar.json; then
            msg="Aday haberleri güncelle"
          else
            msg="Yeni kayyum atamaları eklendi 🔏"
          fi
          git commit -m "$msg"
          git push
